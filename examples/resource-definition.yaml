# Resource Definition wiring the Cloud Run Runner into the Platform Orchestrator.
#
#   humctl create -f examples/resource-definition.yaml
#
# The Orchestrator resolves every ${...} placeholder before the Container Driver
# is called, so the Runner already receives concrete values in its
# RESOURCE_INPUTS_FILE.
apiVersion: entity.humanitec.io/v1b1
kind: Definition
metadata:
  id: cloudrun-workload
entity:
  name: Cloud Run workload
  type: workload
  driver_type: humanitec/container

  # Cloud Account holding the credentials the Runner authenticates to GCP with.
  driver_account: gcp-cloudrun-deployer

  driver_inputs:
    values:
      job:
        image: ghcr.io/humanitec/cloudrun-container-runner:latest
        # Must not collide with an existing directory in the Runner image.
        shared_directory: /humanitec
        service_account: humanitec-runner
        namespace: humanitec-runner

      # Where the Kubernetes Job that runs this image is scheduled. This is the
      # Orchestrator's runner cluster — not where the workload ends up, which is
      # Cloud Run.
      cluster:
        cluster:
          cluster_type: gke
          name: humanitec-runner
          project_id: my-gcp-project
          zone: europe-west1
        account: my-org/gcp-cloudrun-deployer

      # Materialise the Cloud Account credentials as a file and point the Cloud
      # SDK at it. scripts/entrypoint.sh detects whether it holds a service
      # account key or a Workload Identity Federation config.
      credentials_config:
        file: credentials.json
        environment:
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json

      # Everything below is application payload rather than driver plumbing. The
      # driver serialises the whole `values` object into RESOURCE_INPUTS_FILE,
      # which is what score2cloudrun reads. Keys the Runner does not recognise
      # (job, cluster, credentials_config) are ignored.
      project: my-gcp-project
      region: europe-west1
      service: ${context.app.id}-${context.env.id}

      scaling:
        min_instances: 0
        max_instances: 10
      allow_unauthenticated: true

  criteria:
    - class: default
