# Resource Definition wiring the Cloud Run Runner into the Platform Orchestrator.
#
#   humctl apply -f examples/resource-definition.yaml
#
# This uses the built-in Container Driver, which the Humanitec Operator runs
# inside your own cluster and which resolves secrets from your own secret store.
# There is therefore no Cloud Account and no `driver_account`, and the service
# account key travels through `secret_refs` rather than `credentials_config`.
#
# The runner Job lands on the Operator's own cluster by default. To place it
# elsewhere, add secret_refs.cluster.kubeconfig; there is no `cluster` input
# under values for this Driver.
#
# The Orchestrator resolves every ${...} placeholder before the Driver runs, so
# the Runner already receives concrete values in its RESOURCE_INPUTS_FILE.
apiVersion: entity.humanitec.io/v1b1
kind: Definition
metadata:
  id: cloudrun-workload
entity:
  name: Cloud Run workload
  type: workload
  driver_type: humanitec/container-builtin

  driver_inputs:
    values:
      job:
        # image and service_account are required together, unless you supply a
        # pod_template instead.
        image: ghcr.io/humanitec/cloudrun-container-runner:latest
        service_account: humanitec-runner
        shared_directory: /home/my-user/workspace
        namespace: humanitec-runner

        variables:
          # These two keep gcloud's names, even though the Runner calls the
          # Cloud Run Admin API directly, so that Resource Definitions written
          # against earlier versions go on working.
          CLOUDSDK_CORE_PROJECT: my-gcp-project
          CLOUDSDK_RUN_REGION: europe-west1
          # Only the path to the key, never the key itself. Relative, so it
          # resolves inside shared_directory, which the Runner enters first.
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
          # The identity the deployed service runs as.
          CLOUDRUN_RUNTIME_SERVICE_ACCOUNT: cloudrun-deployer@my-gcp-project.iam.gserviceaccount.com
          # The prefix of the deployed service's name.
          CLOUDRUN_SERVICE_NAME_PREFIX: myapp-myenv

    secret_refs:
      # The service account key itself. The Operator reads it from your secret
      # store and writes it into the shared directory under this file name, so
      # the key appears neither in this Resource Definition nor in the image.
      files:
        credentials.json:
          store: my-secret-store
          ref: gcp/cloudrun-deployer-key

  criteria:
    - class: google-cloud-run
