apiVersion: score.dev/v1b1

metadata:
  name: hello-world

containers:
  main:
    image: us-docker.pkg.dev/cloudrun/container/hello
    variables:
      GREETING: "hello from Score"
      DB_URL: ${resources.db.uri}
    volumes:
      /app/backend/data:
        source: ${resources.data}
    resources:
      limits:
        cpu: "1"
        memory: 512Mi

service:
  ports:
    http:
      port: 8080
      targetPort: 8080

resources:
  db:
    type: postgres
  data:
    type: volume
